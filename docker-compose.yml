# Oxygen на сервере:  cp .env.example .env  (задать токен)  &&  docker compose up -d --build
services:
  oxygen:
    build: .
    image: oxygen-server
    restart: unless-stopped
    ports:
      - "${OXYGEN_VIEW_PORT:-80}:8080"                          # просмотр — для всех, только чтение
      - "${OXYGEN_CONTROL_BIND:-127.0.0.1}:${OXYGEN_CONTROL_PORT:-8081}:8081"  # управление — по умолчанию только с самого сервера (SSH-туннель)
    environment:
      OXYGEN_CONTROL_TOKEN: ${OXYGEN_CONTROL_TOKEN:-}
      OXYGEN_ARGS: ${OXYGEN_ARGS:---resume --autosave 10}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      - type: volume
        source: worlds
        target: /data/saved worlds                              # сохранения, настройки, autosave.oxw
    stop_grace_period: 60s                                      # время на сохранение мира при остановке
    # mem_limit: 2g
    # cpus: 2

volumes:
  worlds:
